<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
<!--Gradient for the central 'N' path-->
    <linearGradient id="grad1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
<!--Blue 500-->
      <stop offset="1" stop-color="#8B5CF6"/>
<!--Violet 500-->
    </linearGradient>
<!--Gradient for the outer canvas bounding box-->
    <linearGradient id="grad2" x1="512" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/>
<!--Teal 500-->
      <stop offset="1" stop-color="#3B82F6"/>
<!--Blue 500-->
    </linearGradient>
  </defs>
<!--Outer Canvas / Selection Bounding Box-->
  <rect x="76" y="76" width="360" height="360" rx="64" stroke="url(#grad2)" stroke-width="28" stroke-dasharray="60 40" stroke-linecap="round"/>
<!--Central 'N' / Continuous Collaboration Path-->
  <path d="M176 346 V 166 L 336 346 V 166" stroke="url(#grad1)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
<!--Multiplayer / Collaborative Node Indicators-->
  <circle cx="176" cy="166" r="22" fill="#14B8A6"/>
  <circle cx="336" cy="346" r="22" fill="#8B5CF6"/>
  <circle cx="176" cy="346" r="22" fill="#3B82F6"/>
  <circle cx="336" cy="166" r="22" fill="#3B82F6"/>
</svg>
